name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Push to cdn branch
        run: git push origin HEAD:refs/heads/cdn --force
      - name: Update Webflow scripts
        continue-on-error: true
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          SITE_ID="69bbcdf7631ba7af933392e6"
          CASE_PAGE_ID="6a2bc31525634ed453810d0c"

          CASE_HASH="sha256-$(openssl dgst -sha256 -binary dist/case.js | base64 -w0)"
          GLOBAL_HASH="sha256-$(openssl dgst -sha256 -binary dist/global.js | base64 -w0)"

          wf_curl() {
            local METHOD=$1 URL=$2 BODY=$3
            local OUT STATUS
            OUT=$(curl -s -w "\n%{http_code}" -X "$METHOD" "$URL" \
              -H "Authorization: Bearer $WEBFLOW_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            STATUS=$(echo "$OUT" | tail -n1)
            BODY_OUT=$(echo "$OUT" | head -n-1)
            echo "$METHOD $URL → $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              echo "Error response: $BODY_OUT"
              exit 1
            fi
          }

          wf_curl PATCH "https://api.webflow.com/v2/sites/$SITE_ID/registered_scripts/case_script" \
            "{\"hostedLocation\":\"https://cdn.jsdelivr.net/gh/Advant-Digital/advant-webflow@${GITHUB_REF_NAME}/dist/case.js\",\"integrityHash\":\"$CASE_HASH\",\"version\":\"$VERSION\"}"

          wf_curl PATCH "https://api.webflow.com/v2/sites/$SITE_ID/registered_scripts/global_script" \
            "{\"hostedLocation\":\"https://cdn.jsdelivr.net/gh/Advant-Digital/advant-webflow@${GITHUB_REF_NAME}/dist/global.js\",\"integrityHash\":\"$GLOBAL_HASH\",\"version\":\"$VERSION\"}"

          wf_curl PUT "https://api.webflow.com/v2/sites/$SITE_ID/custom_code" \
            "{\"scripts\":[{\"id\":\"global_script\",\"location\":\"footer\",\"version\":\"$VERSION\"}]}"

          wf_curl PUT "https://api.webflow.com/v2/pages/$CASE_PAGE_ID/custom_code" \
            "{\"scripts\":[{\"id\":\"case_script\",\"location\":\"footer\",\"version\":\"$VERSION\"}]}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.js
