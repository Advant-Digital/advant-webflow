name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Push to cdn branch
        run: git push origin HEAD:refs/heads/cdn --force
      - name: Update Webflow scripts
        continue-on-error: true
        env:
          WEBFLOW_API_TOKEN: ${{ secrets.WEBFLOW_API_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          VERSION_NODOTS=$(echo "$VERSION" | tr -d '.')
          SITE_ID="69bbcdf7631ba7af933392e6"
          CASE_PAGE_ID="6a2bc31525634ed453810d0c"

          CASE_HASH="sha256-$(openssl dgst -sha256 -binary dist/case.js | base64 -w0)"
          GLOBAL_HASH="sha256-$(openssl dgst -sha256 -binary dist/global.js | base64 -w0)"

          wf_curl() {
            local METHOD=$1 URL=$2 BODY=$3
            local OUT STATUS BODY_OUT
            OUT=$(curl -s -w "\n%{http_code}" -X "$METHOD" "$URL" \
              -H "Authorization: Bearer $WEBFLOW_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$BODY")
            STATUS=$(echo "$OUT" | tail -n1)
            BODY_OUT=$(echo "$OUT" | head -n-1)
            echo "$METHOD $URL → $STATUS" >&2
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              echo "Error response: $BODY_OUT" >&2
              return 1
            fi
            echo "$BODY_OUT"
          }

          # Register new scripts for this version and capture the IDs Webflow assigns
          CASE_REG=$(wf_curl POST "https://api.webflow.com/v2/sites/$SITE_ID/registered_scripts/hosted" \
            "{\"displayName\":\"Case Script v${VERSION_NODOTS}\",\"hostedLocation\":\"https://cdn.jsdelivr.net/gh/Advant-Digital/advant-webflow@${GITHUB_REF_NAME}/dist/case.js\",\"integrityHash\":\"$CASE_HASH\",\"version\":\"$VERSION\"}")
          CASE_SCRIPT_ID=$(echo "$CASE_REG" | jq -r '.id')

          GLOBAL_REG=$(wf_curl POST "https://api.webflow.com/v2/sites/$SITE_ID/registered_scripts/hosted" \
            "{\"displayName\":\"Global Script v${VERSION_NODOTS}\",\"hostedLocation\":\"https://cdn.jsdelivr.net/gh/Advant-Digital/advant-webflow@${GITHUB_REF_NAME}/dist/global.js\",\"integrityHash\":\"$GLOBAL_HASH\",\"version\":\"$VERSION\"}")
          GLOBAL_SCRIPT_ID=$(echo "$GLOBAL_REG" | jq -r '.id')

          echo "Registered: case=$CASE_SCRIPT_ID global=$GLOBAL_SCRIPT_ID"

          # Apply to site and case template page
          wf_curl PUT "https://api.webflow.com/v2/sites/$SITE_ID/custom_code" \
            "{\"scripts\":[{\"id\":\"$GLOBAL_SCRIPT_ID\",\"location\":\"footer\",\"version\":\"$VERSION\"}]}"

          wf_curl PUT "https://api.webflow.com/v2/pages/$CASE_PAGE_ID/custom_code" \
            "{\"scripts\":[{\"id\":\"$CASE_SCRIPT_ID\",\"location\":\"footer\",\"version\":\"$VERSION\"}]}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.js
